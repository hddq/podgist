name: Integration Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      GOCACHE: /tmp/podgist-gocache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare Go caches
        run: mkdir -p "$GOCACHE" /tmp/podgist-gotmp

      - name: Verify Docker availability
        run: docker version

      - name: Run integration tests
        env:
          GOTMPDIR: /tmp/podgist-gotmp
        run: go test ./internal/http ./internal/migrations -count=1
